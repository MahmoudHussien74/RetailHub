<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailHub POS - جاري التشغيل</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 75%, #020617);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      width: 100%;
    }
    .logo-wrapper {
      position: relative;
      margin-bottom: 22px;
    }
    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.45) 0%, rgba(99, 102, 241, 0) 70%);
      border-radius: 50%;
      filter: blur(12px);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-img {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 26px;
    }
    .loader-box {
      width: 240px;
      margin-bottom: 18px;
    }
    .progress-bar {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 35%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6, #6366f1);
      border-radius: 9999px;
      animation: progress-indeterminate 1.8s ease-in-out infinite;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s ease;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #06b6d4;
      border-radius: 50%;
      box-shadow: 0 0 10px #06b6d4;
      animation: blink 1.2s infinite;
    }

    /* Error Box */
    .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 360px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      -webkit-app-region: no-drag;
    }
    .error-msg {
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-retry {
      background: #0284c7;
      color: white;
    }
    .btn-retry:hover {
      background: #0369a1;
    }
    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }
    .btn-close:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    @keyframes progress-indeterminate {
      0% { left: -35%; }
      50% { left: 40%; width: 55%; }
      100% { left: 100%; width: 25%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="icon.png" class="logo-img" alt="RetailHub" onerror="this.style.display='none'">
    </div>
    
    <h1>RetailHub POS</h1>
    <div class="subtitle">نظام نقاط البيع وإدارة المخازن المتكامل</div>

    <div class="loader-box" id="loader-box">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="status-text" id="status-container">
      <div class="status-dot"></div>
      <span id="status-text">جاري بدء تشغيل النظام والاتصال بقاعدة البيانات...</span>
    </div>

    <div class="error-box" id="error-box">
      <div class="error-msg" id="error-msg">
        تعذر الاتصال بخادم النظام أو قاعدة البيانات. يرجى التأكد من تشغيل خادم SQL Server ثم إعادة المحاولة.
      </div>
      <div class="btn-group">
        <button class="btn btn-retry" onclick="retry()">إعادة المحاولة</button>
        <button class="btn btn-close" onclick="closeApp()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('status-update', (event, text) => {
      document.getElementById('status-text').innerText = text;
    });

    ipcRenderer.on('backend-failed', (event, detail) => {
      document.getElementById('loader-box').style.display = 'none';
      document.getElementById('status-container').style.display = 'none';
      const errorBox = document.getElementById('error-box');
      errorBox.style.display = 'flex';
      if (detail) {
        document.getElementById('error-msg').innerText = detail;
      }
    });

    function retry() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('loader-box').style.display = 'block';
      document.getElementById('status-container').style.display = 'flex';
      document.getElementById('status-text').innerText = 'جاري إعادة محاولة الاتصال...';
      ipcRenderer.send('retry-start');
    }

    function closeApp() {
      ipcRenderer.send('close-splash');
    }
  </script>
</body>
</html>
